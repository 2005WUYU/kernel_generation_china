[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ascend-kernel-lab"
version = "0.1.0"
description = "Recoverable Kimi-driven Triton-Ascend kernel generation and evaluation pipeline"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ascend Kernel Lab contributors" }]
dependencies = [
  "PyYAML>=6.0.1,<7",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.10",
  "pytest>=8.2",
  "pytest-cov>=5",
  "ruff>=0.5",
  "types-PyYAML>=6.0",
]

[project.scripts]
akg = "ascend_kernel_lab.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "npu: requires a configured Ascend NPU",
  "integration: exercises multiple application components",
]

[tool.coverage.run]
branch = true
source = ["ascend_kernel_lab"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
