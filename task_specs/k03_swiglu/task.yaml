id: k03_swiglu
version: 1
name: SwiGLU
description: Apply SiLU to the first input and multiply it elementwise by the second input.
entry_point: custom_op
inputs:
  - {name: a, shape: [M, N], dtypes: [float16, bfloat16], layout: contiguous}
  - {name: b, shape: [M, N], dtypes: [float16, bfloat16], layout: contiguous}
outputs:
  - {name: output, shape: [M, N], dtype: same_as_a, layout: contiguous}
semantics: {formula: "silu(a) * b", silu: "a / (1 + exp(-a))", accumulation_dtype: float32}
correctness:
  check_input_unchanged: true
  rtol: {float16: 0.004, bfloat16: 0.015}
  atol: {float16: 0.004, bfloat16: 0.015}
benchmark: {warmup: 20, measurement_batches: 7, target_batch_time_ms: 200, maximum_cv: 0.05}
restrictions: {allow_multiple_triton_kernels: true, allow_torch_allocation: true, allow_torch_compute: false, allow_cpu_fallback: false, allow_file_io: false, allow_network: false, allow_subprocess: false}
