id: k05_row_softmax
version: 1
name: Row Softmax
description: Compute numerically stable softmax over the last dimension of a 2D tensor.
entry_point: custom_op
inputs:
  - {name: x, shape: [M, N], dtypes: [float16, bfloat16, float32], layout: contiguous}
outputs:
  - {name: output, shape: [M, N], dtype: same_as_x, layout: contiguous}
semantics: {formula: "exp(x - max(x)) / sum(exp(x - max(x)))", reduction_dim: -1, accumulation_dtype: float32}
correctness:
  check_input_unchanged: true
  rtol: {float16: 0.003, bfloat16: 0.01, float32: 0.0001}
  atol: {float16: 0.003, bfloat16: 0.01, float32: 0.00001}
benchmark: {warmup: 20, measurement_batches: 7, target_batch_time_ms: 200, maximum_cv: 0.05}
restrictions: {allow_multiple_triton_kernels: true, allow_torch_allocation: true, allow_torch_compute: false, allow_cpu_fallback: false, allow_file_io: false, allow_network: false, allow_subprocess: false}
