name: cpu-ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: cpu-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Dependency consistency
        run: python -m pip check
      - name: Lint
        run: python -m ruff check src tests
      - name: Type check
        run: python -m mypy src
      - name: CPU tests
        run: python -m pytest -m 'not npu'
      - name: Shell syntax
        run: |
          for script in scripts/*.sh; do
            sh -n "$script"
          done
      - name: Shellcheck
        run: shellcheck scripts/*.sh
      - name: CLI smoke
        run: python -m ascend_kernel_lab --help
      - name: Build and smoke-test wheel/sdist
        run: make package-check PYTHON=python
